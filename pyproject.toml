[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satemshi-app"
version = "0.1.0"
description = "Capture and ingest for an Obsidian vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Ruff is pinned to a minor series: a new one can add rules to the
# selected sets, and CI going red on an unrelated PR because a linter
# released that morning is not a useful signal.
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.scripts]
satemshi = "satemshi.__main__:main"

[tool.setuptools.packages.find]
include = ["satemshi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["satemshi", "conftest"]
