# Satemshi App — instance configuration template.
# Copy this file to config.yaml and edit. config.yaml is gitignored.

# Timezone that decides what "today" means for captures and for the
# photo sweep. Everything the bot writes is stamped in this zone.
timezone: Asia/Bangkok

# The RAW zone of a daily note. The LINE bot writes here verbatim,
# before any LLM touches the text; the nightly ingest reads this zone
# and promotes it into the wiki. Nothing outside these markers is ever
# modified — the rest of the note is the user's freehand journal.
raw:
  daily_notes_dir: "Daily Notes"
  heading: "## RAW"
  start_marker: "<!-- raw:start -->"
  end_marker: "<!-- raw:end -->"

# LINE Bot capture channel.
line_bot:
  enabled: true
  # Path the webhook is served on. Register
  # https://<your-host>{webhook_path} in the LINE Developers console.
  webhook_path: /line/webhook
  # Only these LINE user ids may write to the vault. Send "whoami" to
  # the bot to find yours. Empty means anyone who can reach the
  # webhook — fine behind Tailscale, risky when publicly exposed.
  allowed_user_ids: []
  # Where in-progress conversations are parked. Relative paths resolve
  # against the working directory, never into the vault.
  session_dir: sessions
  # Abandon a half-finished capture after this long, so tomorrow's
  # first message is not read as an answer to yesterday's question.
  session_ttl_seconds: 1800
  # The follow-ups the bot asks after you describe an event. Asked in
  # order, one per message; "-" skips one, "done" finishes early.
  event_slots:
    - key: when
      question: "When did it happen? (e.g. 14:30, morning, all day)"
    - key: where
      question: "Where was it?"
    - key: who
      question: "Who was there? (comma-separated)"
    - key: notes
      question: "Anything else worth remembering?"
  # Asked once per photo after a "photos" sweep, for the pictures that
  # have no answers on them yet. The answers are added to the photo's
  # existing RAW entry as key:: value fields the nightly ingest can read.
  # Fewer questions = less friction per photo — trim this list rather
  # than skipping every photo. Set to [] to have the sweep only list.
  photo_slots:
    - key: where
      question: "Where was this taken?"
    - key: what
      question: "What is it?"
    - key: who
      question: "Who's in it / who was around? (comma-separated)"
    - key: event
      question: "Part of one of today's events? (name it, or '-')"
    - key: notes
      question: "Anything about it worth remembering?"
  # Categories offered when recording an expense — via "spent 120 lunch"
  # or by answering "slip" to a photo (Thai banking apps save transfer
  # slips to the gallery, so the photo sweep finds the day's payments).
  # Reply with a number or a name; [] turns the category question off.
  expense_categories:
    [food, transport, groceries, household, health, fun, bills, other]

# Photos.
photos:
  # Where images sent to the bot are filed, relative to VAULT_PATH.
  # {yyyy}, {mm} and {dd} expand from the photo's own capture date.
  attachments_dir: "Attachments/{yyyy}/{mm}"
  # Extra directories the "photos" command sweeps for pictures taken
  # today — a phone sync folder, a camera import directory. Read-only:
  # the sweep records what it finds, it never moves or edits them.
  source_dirs: []
  extensions: [".jpg", ".jpeg", ".png", ".heic", ".webp"]

# LLM tasks: each task picks one provider + one model. The webapp's
# settings page lets you change these at runtime; this file just
# provides the defaults on first run.
tasks:
  mood_question:
    provider: ollama
    model: qwen2.5:7b
  link_summarize:
    provider: ollama
    model: qwen2.5:7b
  entity_extract:
    provider: claude
    model: claude-sonnet-4-6
  ingest_summary:
    provider: claude
    model: claude-sonnet-4-6

# Auto-commit of the vault after a capture, so the notes get history
# and — with auto_push — a copy off this one disk. The vault must
# already be a git repository; the app will not create one. Off by
# default in code, so an absent block never starts committing someone's
# vault; see docs/deploy.md.
vault_git:
  enabled: true
  # The first change opens a window and every change inside it joins the
  # same commit, so a capture and the four answers that follow it are
  # one commit rather than five. Also a ceiling: nothing waits longer
  # than this to be committed.
  coalesce_seconds: 300
  # Push to the vault's "origin" remote after each commit. Needs
  # credentials that work with no terminal attached — a daemon cannot
  # answer a password prompt, so one produces a logged failure and a
  # commit that stays local.
  auto_push: true

# Ingest pipeline schedule (handled by systemd timer in production;
# this is for documentation / manual override).
ingest:
  cron: "0 2 * * *"   # 02:00 every day
  lookback_days: 1    # ingest yesterday by default

# Daily Notes section markers — keep in sync with the vault's
# CLAUDE.md "Daily Notes 2-zone convention".
daily_notes:
  start_marker: "<!-- captures:start -->"
  end_marker: "<!-- captures:end -->"
